<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Para mi Andrea 🌻</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Georgia, "Times New Roman", serif;
        touch-action: none;
    }

    body {
        position: relative;
    }

    canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: #000;
    }

    /* =========================
       PANTALLA DE INICIO
    ========================= */

    #intro {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        background:
            radial-gradient(circle at center,
                rgba(45, 30, 0, 0.25),
                rgba(0, 0, 0, 0.98) 70%);
        transition: opacity 0.8s ease, visibility 0.8s ease;
        cursor: pointer;
    }

    #intro.oculto {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
    }

    #intro h1 {
        color: #ffe66d;
        font-size: clamp(28px, 7vw, 52px);
        line-height: 1.2;
        margin-bottom: 25px;
        text-shadow:
            0 0 8px rgba(255, 220, 80, 0.8),
            0 0 20px rgba(255, 180, 0, 0.35);
    }

    #intro p {
        color: white;
        font-size: clamp(17px, 4.5vw, 25px);
        opacity: 0.9;
        animation: respirar 2s ease-in-out infinite;
    }

    @keyframes respirar {
        0%, 100% {
            opacity: 0.55;
        }

        50% {
            opacity: 1;
        }
    }

    /* =========================
       MENSAJE PRINCIPAL
    ========================= */

    #mensaje {
        position: fixed;
        left: 50%;
        top: 11%;
        transform: translate(-50%, -15px);
        width: 92%;
        max-width: 850px;
        text-align: center;
        z-index: 20;

        opacity: 0;
        visibility: hidden;

        color: white;

        transition:
            opacity 1.2s ease,
            transform 1.2s ease,
            visibility 1.2s ease;
    }

    #mensaje.mostrar {
        opacity: 1;
        visibility: visible;
        transform: translate(-50%, 0);
    }

    #mensaje h2 {
        font-size: clamp(27px, 6vw, 52px);
        line-height: 1.2;
        color: #ffe86b;
        font-weight: bold;

        text-shadow:
            0 0 5px rgba(255, 230, 100, 0.8),
            0 0 14px rgba(255, 190, 0, 0.35);
    }

    #mensaje .subtitulo {
        margin-top: 13px;
        font-size: clamp(19px, 4vw, 31px);
        color: #fff;
        text-shadow:
            0 0 5px rgba(255, 255, 255, 0.5);
    }

    #mensaje .amor {
        margin-top: 8px;
        font-size: clamp(21px, 4.5vw, 34px);
        color: #ffe66d;
        font-weight: bold;

        text-shadow:
            0 0 5px rgba(255, 220, 80, 0.7);
    }

    /* =========================
       FOTOS
    ========================= */

    .foto-orbita {
        position: fixed;
        left: 50%;
        top: 50%;

        width: 110px;
        height: 110px;

        object-fit: cover;
        border-radius: 50%;

        border: 3px solid rgba(255, 225, 70, 0.95);

        box-shadow:
            0 0 8px rgba(255, 220, 50, 0.8),
            0 0 18px rgba(255, 190, 0, 0.3);

        transform: translate(-50%, -50%);

        z-index: 10;

        will-change: transform, opacity;
        backface-visibility: hidden;
    }

    /* =========================
       CONTROL
    ========================= */

    #ayuda {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);

        z-index: 15;

        color: rgba(255, 255, 255, 0.6);

        font-family: Arial, sans-serif;
        font-size: 12px;

        pointer-events: none;

        opacity: 0;
        transition: opacity 1s ease;
    }

    #ayuda.mostrar {
        opacity: 1;
    }

    /* =========================
       OPTIMIZACIÓN CELULAR
    ========================= */

    @media (max-width: 600px) {

        #mensaje {
            top: 10%;
            width: 94%;
        }

        /*
         En celular usamos sombras mucho más
         pequeñas para evitar tirones cuando
         aparece el mensaje.
        */

        #mensaje h2 {
            text-shadow:
                0 0 4px rgba(255, 230, 100, 0.7);
        }

        #mensaje .subtitulo {
            text-shadow: none;
        }

        #mensaje .amor {
            text-shadow:
                0 0 4px rgba(255, 220, 80, 0.6);
        }

        .foto-orbita {
            width: 86px;
            height: 86px;

            border-width: 2px;

            box-shadow:
                0 0 6px rgba(255, 220, 50, 0.65);
        }

        #ayuda {
            display: none;
        }
    }

    /* =========================
       RESPETO A REDUCED MOTION
    ========================= */

    @media (prefers-reduced-motion: reduce) {

        #intro p {
            animation: none;
        }

        #mensaje,
        #intro {
            transition: opacity 0.3s ease;
        }
    }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<!-- =========================
     INTRO
========================= -->

<div id="intro">
    <h1>Feliz día de las flores amarillas 🌻</h1>
    <p>Toca para iniciar ✨</p>
</div>

<!-- =========================
     MENSAJE
========================= -->

<div id="mensaje">

    <h2>
        Feliz día de las flores amarillas, mi Andrea 🌻
    </h2>

    <div class="subtitulo">
        Para ti, mi amor.
    </div>

    <div class="amor">
        Te amo, mi chinita ❤️
    </div>

</div>

<!-- =========================
     FOTOS
========================= -->

<img src="fotos1.jpeg" class="foto-orbita" id="foto1" alt="">
<img src="foto2.jpeg" class="foto-orbita" id="foto2" alt="">
<img src="foto3.jpeg" class="foto-orbita" id="foto3" alt="">

<div id="ayuda">
    Arrastra para mover la galaxia ✨
</div>

<audio id="musica" src="musica.mp3" preload="auto" loop></audio>

<script>

/* =========================================================
   CONFIGURACIÓN GENERAL
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {
    alpha: false
});

const esMovil = window.matchMedia("(max-width: 600px)").matches;

let ancho = window.innerWidth;
let alto = window.innerHeight;

let dpr = Math.min(
    window.devicePixelRatio || 1,
    esMovil ? 1 : 1.25
);

let centroX = ancho / 2;
let centroY = alto / 2;


/* =========================================================
   CANVAS
========================================================= */

function ajustarCanvas() {

    ancho = window.innerWidth;
    alto = window.innerHeight;

    centroX = ancho / 2;
    centroY = alto / 2;

    canvas.width = Math.floor(ancho * dpr);
    canvas.height = Math.floor(alto * dpr);

    canvas.style.width = ancho + "px";
    canvas.style.height = alto + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

ajustarCanvas();

window.addEventListener("resize", ajustarCanvas);


/* =========================================================
   ESTRELLAS
========================================================= */

const estrellas = [];

const cantidadEstrellas = esMovil ? 55 : 140;

for (let i = 0; i < cantidadEstrellas; i++) {

    estrellas.push({
        x: Math.random() * ancho,
        y: Math.random() * alto,
        radio: Math.random() * 1.4 + 0.3,
        brillo: Math.random() * Math.PI * 2,
        velocidad: Math.random() * 0.015 + 0.005
    });
}

function dibujarEstrellas() {

    for (let i = 0; i < estrellas.length; i++) {

        const estrella = estrellas[i];

        estrella.brillo += estrella.velocidad;

        const alpha =
            0.35 +
            Math.sin(estrella.brillo) * 0.3;

        ctx.globalAlpha = alpha;

        ctx.fillStyle = "#ffffff";

        ctx.beginPath();

        ctx.arc(
            estrella.x,
            estrella.y,
            estrella.radio,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;
}


/* =========================================================
   PARTÍCULAS DE LA GALAXIA
========================================================= */

const particulas = [];

const cantidadParticulas = esMovil ? 260 : 650;

for (let i = 0; i < cantidadParticulas; i++) {

    const angulo =
        Math.random() * Math.PI * 2;

    const distancia =
        35 +
        Math.pow(Math.random(), 0.65) *
        Math.min(ancho, alto) *
        0.55;

    particulas.push({

        angulo: angulo,

        distancia: distancia,

        velocidad:
            0.0004 +
            Math.random() * 0.001,

        tamaño:
            Math.random() * 1.5 + 0.3,

        alpha:
            Math.random() * 0.65 + 0.2,

        tono:
            Math.random()
    });
}


/* =========================================================
   MOVIMIENTO DE GALAXIA
========================================================= */

let desplazamientoX = 0;
let desplazamientoY = 0;

let objetivoX = 0;
let objetivoY = 0;

let arrastrando = false;

let ultimoX = 0;
let ultimoY = 0;


/* =========================================================
   EVENTOS DE ARRASTRE
========================================================= */

function comenzarArrastre(x, y) {

    arrastrando = true;

    ultimoX = x;
    ultimoY = y;
}

function moverArrastre(x, y) {

    if (!arrastrando) {
        return;
    }

    const dx = x - ultimoX;
    const dy = y - ultimoY;

    objetivoX += dx * 0.8;
    objetivoY += dy * 0.8;

    ultimoX = x;
    ultimoY = y;
}

function terminarArrastre() {

    arrastrando = false;
}


canvas.addEventListener("mousedown", function(e) {

    comenzarArrastre(
        e.clientX,
        e.clientY
    );

});

canvas.addEventListener("mousemove", function(e) {

    moverArrastre(
        e.clientX,
        e.clientY
    );

});

canvas.addEventListener("mouseup", terminarArrastre);
canvas.addEventListener("mouseleave", terminarArrastre);


canvas.addEventListener(
    "touchstart",
    function(e) {

        const touch = e.touches[0];

        comenzarArrastre(
            touch.clientX,
            touch.clientY
        );

    },
    { passive: true }
);


canvas.addEventListener(
    "touchmove",
    function(e) {

        const touch = e.touches[0];

        moverArrastre(
            touch.clientX,
            touch.clientY
        );

    },
    { passive: true }
);


canvas.addEventListener(
    "touchend",
    terminarArrastre,
    { passive: true }
);


/* =========================================================
   GALAXIA
========================================================= */

function dibujarGalaxia(tiempo) {

    desplazamientoX +=
        (objetivoX - desplazamientoX) * 0.08;

    desplazamientoY +=
        (objetivoY - desplazamientoY) * 0.08;


    const cx =
        centroX + desplazamientoX;

    const cy =
        centroY + desplazamientoY;


    /*
       PARTICULAS
    */

    for (let i = 0; i < particulas.length; i++) {

        const p = particulas[i];

        p.angulo += p.velocidad;

        const angulo =
            p.angulo +
            p.distancia * 0.00025;

        const deformacion =
            1 +
            Math.sin(
                p.distancia * 0.035
            ) * 0.04;

        const x =
            cx +
            Math.cos(angulo) *
            p.distancia *
            deformacion;

        const y =
            cy +
            Math.sin(angulo) *
            p.distancia *
            0.48 *
            deformacion;


        let alpha = p.alpha;

        /*
           En móvil mantenemos las partículas
           simples y sin sombras.
        */

        if (!esMovil) {

            ctx.fillStyle =
                p.tono > 0.65
                    ? `rgba(255,220,90,${alpha})`
                    : `rgba(255,245,180,${alpha})`;

        } else {

            ctx.fillStyle =
                `rgba(255,225,100,${alpha * 0.8})`;
        }


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            p.tamaño,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    /*
       ANILLO CENTRAL
    */

    ctx.save();

    ctx.translate(cx, cy);

    ctx.rotate(
        -0.18 +
        Math.sin(tiempo * 0.0001) * 0.02
    );


    const radioAnillo =
        Math.min(ancho, alto) *
        (esMovil ? 0.095 : 0.105);


    /*
       En móvil usamos un gradiente más sencillo.
    */

    const gradiente =
        ctx.createRadialGradient(
            0,
            0,
            radioAnillo * 0.35,
            0,
            0,
            radioAnillo * 1.4
        );


    gradiente.addColorStop(
        0,
        "rgba(255,210,30,0)"
    );

    gradiente.addColorStop(
        0.45,
        "rgba(255,190,20,0.35)"
    );

    gradiente.addColorStop(
        0.72,
        "rgba(255,225,80,0.9)"
    );

    gradiente.addColorStop(
        0.86,
        "rgba(255,160,0,0.3)"
    );

    gradiente.addColorStop(
        1,
        "rgba(255,130,0,0)"
    );


    ctx.fillStyle = gradiente;

    ctx.beginPath();

    ctx.ellipse(
        0,
        0,
        radioAnillo * 1.65,
        radioAnillo * 0.58,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       AGUJERO NEGRO
    */

    const negro =
        ctx.createRadialGradient(
            0,
            0,
            0,
            0,
            0,
            radioAnillo * 0.72
        );

    negro.addColorStop(
        0,
        "#000000"
    );

    negro.addColorStop(
        0.75,
        "#000000"
    );

    negro.addColorStop(
        1,
        "rgba(0,0,0,0.1)"
    );

    ctx.fillStyle = negro;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        radioAnillo * 0.72,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       BRILLO CENTRAL SOLO EN PC
    */

    if (!esMovil) {

        ctx.shadowColor =
            "rgba(255,210,40,0.6)";

        ctx.shadowBlur = 15;

        ctx.strokeStyle =
            "rgba(255,220,70,0.7)";

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.ellipse(
            0,
            0,
            radioAnillo * 1.35,
            radioAnillo * 0.42,
            0,
            0,
            Math.PI * 2
        );

        ctx.stroke();

        ctx.shadowBlur = 0;
    }

    ctx.restore();
}


/* =========================================================
   FLORES
========================================================= */

const flores = [];

function crearFlorCaida() {

    flores.push({

        tipo: "caida",

        x: Math.random() * ancho,

        y: -30,

        tamaño:
            esMovil
                ? Math.random() * 8 + 7
                : Math.random() * 11 + 8,

        velocidad:
            Math.random() * 0.7 + 0.45,

        rotacion:
            Math.random() * Math.PI * 2,

        giro:
            Math.random() * 0.025 - 0.012,

        oscilacion:
            Math.random() * Math.PI * 2,

        vida: 1
    });
}


function crearFlorLateral() {

    flores.push({

        tipo: "lateral",

        x:
            Math.random() > 0.5
                ? -20
                : ancho + 20,

        y:
            Math.random() * alto,

        tamaño:
            esMovil
                ? Math.random() * 7 + 6
                : Math.random() * 10 + 7,

        velocidad:
            Math.random() * 0.6 + 0.25,

        rotacion:
            Math.random() * Math.PI * 2,

        giro:
            Math.random() * 0.02 - 0.01,

        oscilacion:
            Math.random() * Math.PI * 2,

        vida: 1,

        direccion:
            Math.random() > 0.5
                ? 1
                : -1
    });
}


function dibujarFlor(flor) {

    ctx.save();

    ctx.translate(
        flor.x,
        flor.y
    );

    ctx.rotate(flor.rotacion);

    const s = flor.tamaño;


    /*
       Centro
    */

    ctx.fillStyle =
        "#e6a900";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        s * 0.28,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       Pétalos
    */

    ctx.fillStyle =
        "#ffd92f";

    for (let i = 0; i < 6; i++) {

        const angulo =
            (Math.PI * 2 / 6) * i;

        const px =
            Math.cos(angulo) *
            s * 0.48;

        const py =
            Math.sin(angulo) *
            s * 0.48;

        ctx.beginPath();

        ctx.ellipse(
            px,
            py,
            s * 0.38,
            s * 0.18,
            angulo,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.restore();
}


function actualizarFlores() {

    for (let i = flores.length - 1; i >= 0; i--) {

        const flor = flores[i];

        flor.rotacion += flor.giro;

        flor.oscilacion += 0.025;


        if (flor.tipo === "caida") {

            flor.y += flor.velocidad;

            flor.x +=
                Math.sin(flor.oscilacion) *
                0.35;

        } else {

            flor.x +=
                flor.velocidad *
                flor.direccion;

            flor.y +=
                Math.sin(flor.oscilacion) *
                0.25;
        }


        dibujarFlor(flor);


        if (
            flor.y > alto + 50 ||
            flor.x < -60 ||
            flor.x > ancho + 60
        ) {

            flores.splice(i, 1);
        }
    }
}


/* =========================================================
   FOTOS ORBITANDO
========================================================= */

const fotos = [

    document.getElementById("foto1"),
    document.getElementById("foto2"),
    document.getElementById("foto3")

];


function actualizarFotos(tiempo) {

    const radio =
        Math.min(ancho, alto) *
        (esMovil ? 0.19 : 0.23);


    const velocidad =
        esMovil
            ? 0.00018
            : 0.00022;


    for (let i = 0; i < fotos.length; i++) {

        const foto = fotos[i];

        const angulo =
            tiempo * velocidad +
            (Math.PI * 2 / 3) * i;


        const x =
            Math.cos(angulo) *
            radio;


        const y =
            Math.sin(angulo) *
            radio *
            0.72;


        const escala =
            0.82 +
            ((y / radio) + 1) *
            0.08;


        const opacidad =
            0.72 +
            ((y / radio) + 1) *
            0.14;


        foto.style.transform =
            `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(${escala})`;

        foto.style.opacity =
            opacidad.toFixed(2);

        foto.style.zIndex =
            y > 0 ? 12 : 8;
    }
}


/* =========================================================
   ANIMACIÓN PRINCIPAL
========================================================= */

let ultimoFrame = 0;

const intervaloFrame =
    esMovil
        ? 1000 / 45
        : 1000 / 60;


function animar(tiempo) {

    requestAnimationFrame(animar);


    /*
       Limitamos los frames en celular.
       Esto evita que el navegador trabaje
       innecesariamente a 60/90/120 FPS.
    */

    if (
        tiempo - ultimoFrame <
        intervaloFrame
    ) {
        return;
    }

    ultimoFrame = tiempo;


    /*
       Fondo
    */

    ctx.fillStyle = "#000";

    ctx.fillRect(
        0,
        0,
        ancho,
        alto
    );


    dibujarEstrellas();

    dibujarGalaxia(tiempo);

    actualizarFlores();

    actualizarFotos(tiempo);
}


requestAnimationFrame(animar);


/* =========================================================
   INICIO
========================================================= */

const intro =
    document.getElementById("intro");

const mensaje =
    document.getElementById("mensaje");

const ayuda =
    document.getElementById("ayuda");

const musica =
    document.getElementById("musica");


let iniciado = false;


function comenzar() {

    if (iniciado) {
        return;
    }

    iniciado = true;


    /*
       Música después del toque del usuario.
    */

    musica.volume = 0.65;

    const promesa =
        musica.play();

    if (promesa !== undefined) {

        promesa.catch(() => {
            /*
               El navegador puede bloquear
               el audio; no detenemos la página.
            */
        });
    }


    intro.classList.add("oculto");


    /*
       Mostramos el mensaje después de un
       pequeño retraso.

       En móvil usamos un retraso ligeramente
       mayor para que la transición no coincida
       exactamente con la desaparición del intro.
    */

    const retraso =
        esMovil
            ? 900
            : 700;


    setTimeout(() => {

        mensaje.classList.add("mostrar");

    }, retraso);


    setTimeout(() => {

        ayuda.classList.add("mostrar");

    }, 2500);


    /*
       Flores.
    */

    const intervaloFlores =
        esMovil
            ? 1050
            : 650;


    const intervaloLaterales =
        esMovil
            ? 2400
            : 1400;


    crearFlorCaida();


    setInterval(
        crearFlorCaida,
        intervaloFlores
    );


    setInterval(
        crearFlorLateral,
        intervaloLaterales
    );
}


/* =========================================================
   CLICK / TOQUE PARA INICIAR
========================================================= */

intro.addEventListener(
    "click",
    comenzar,
    {
        passive: true
    }
);

intro.addEventListener(
    "touchend",
    comenzar,
    {
        passive: true
    }
);

</script>

</body>
</html>
