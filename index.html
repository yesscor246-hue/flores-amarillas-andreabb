<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Para Andrea 🌻❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    position: relative;
}

/* =========================
   PANTALLA DE INICIO
========================= */

#inicio {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background:
        radial-gradient(circle at center, #201500 0%, #090600 45%, #000 100%);
    color: white;
    cursor: pointer;
    transition: opacity .6s ease;
}

#inicio.ocultar {
    opacity: 0;
    pointer-events: none;
}

.boton-inicio {
    padding: 18px 32px;
    border-radius: 50px;
    border: 1px solid rgba(255,220,80,.7);
    background: rgba(255,190,0,.12);
    color: #ffe76b;
    font-size: 18px;
    font-weight: bold;
    box-shadow:
        0 0 20px rgba(255,200,0,.35),
        inset 0 0 15px rgba(255,200,0,.08);
    animation: pulsar 1.8s infinite;
}

.subinicio {
    margin-top: 18px;
    color: rgba(255,255,255,.65);
    font-size: 13px;
}

@keyframes pulsar {
    0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 20px rgba(255,200,0,.3);
    }
    50% {
        transform: scale(1.06);
        box-shadow: 0 0 35px rgba(255,200,0,.65);
    }
}

/* =========================
   CANVAS
========================= */

#galaxia {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}

/* =========================
   MENSAJE
========================= */

#mensaje {
    position: fixed;
    z-index: 20;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    max-width: 600px;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.5s ease;
}

body.iniciado #mensaje {
    opacity: 1;
}

.titulo {
    color: #ffe96b;
    font-size: clamp(27px, 7vw, 55px);
    font-weight: bold;
    text-shadow:
        0 0 10px rgba(255,210,50,.9),
        0 0 25px rgba(255,180,0,.7),
        0 0 50px rgba(255,150,0,.4);
    animation: brillo 3s ease-in-out infinite;
}

.nombre {
    margin-top: 12px;
    color: #fff;
    font-size: clamp(23px, 6vw, 43px);
    font-weight: bold;
    text-shadow:
        0 0 10px rgba(255,255,255,.8),
        0 0 25px rgba(255,200,80,.5);
}

.frase {
    margin-top: 14px;
    color: rgba(255,255,255,.9);
    font-size: clamp(15px, 4vw, 23px);
    line-height: 1.5;
}

.corazon {
    display: inline-block;
    animation: latido 1.2s infinite;
}

@keyframes brillo {
    0%,100% {
        filter: brightness(1);
    }
    50% {
        filter: brightness(1.35);
    }
}

@keyframes latido {
    0%,100% {
        transform: scale(1);
    }
    15% {
        transform: scale(1.25);
    }
    30% {
        transform: scale(1);
    }
}

/* =========================
   FLORES CAÍDAS
========================= */

.flor {
    position: fixed;
    z-index: 15;
    pointer-events: none;
    font-size: 22px;
    animation: caer linear forwards;
    filter: drop-shadow(0 0 5px rgba(255,220,40,.8));
}

@keyframes caer {
    0% {
        transform:
            translateY(-60px)
            rotate(0deg)
            translateX(0);
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    50% {
        transform:
            translateY(50vh)
            rotate(180deg)
            translateX(35px);
    }

    100% {
        transform:
            translateY(110vh)
            rotate(360deg)
            translateX(-35px);
        opacity: 0;
    }
}

/* =========================
   INDICADOR DE MÚSICA
========================= */

#musica-indicador {
    position: fixed;
    z-index: 30;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,.65);
    font-size: 12px;
    opacity: 0;
    transition: opacity .8s ease;
    pointer-events: none;
}

body.iniciado #musica-indicador {
    opacity: 1;
}
</style>
</head>

<body>

<!-- =========================
     MÚSICA
========================= -->

<audio
    id="musica"
    loop
    preload="auto"
    playsinline
>
    <source src="./musica.mp3" type="audio/mpeg">
</audio>


<!-- =========================
     PANTALLA INICIAL
========================= -->

<div id="inicio">
    <div class="boton-inicio">
        🌻 Toca para iniciar 🌻
    </div>

    <div class="subinicio">
        Hay algo especial preparado para ti ❤️
    </div>
</div>


<!-- =========================
     GALAXIA
========================= -->

<canvas id="galaxia"></canvas>


<!-- =========================
     MENSAJE
========================= -->

<div id="mensaje">

    <div class="titulo">
        Te amo Andrea
    </div>

    <div class="nombre">
        feliz día de las flores amarillas 🌻
    </div>

    <div class="frase">
        Para ti, mi amor.<br>
        Eres muy especial para mí
        <span class="corazon">❤️</span>
    </div>

</div>

<div id="musica-indicador">
    🎵 Reproduciendo música...
</div>


<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const inicio = document.getElementById("inicio");
const musica = document.getElementById("musica");
const canvas = document.getElementById("galaxia");
const ctx = canvas.getContext("2d");


/* =====================================================
   VARIABLES
===================================================== */

let musicaIniciada = false;
let ancho = 0;
let alto = 0;
let estrellas = [];
let flores = [];
let particulas = [];
let tiempo = 0;


/* =====================================================
   AJUSTAR CANVAS
===================================================== */

function ajustarCanvas() {

    ancho = window.innerWidth;
    alto = window.innerHeight;

    const pixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);

    canvas.width = ancho * pixelRatio;
    canvas.height = alto * pixelRatio;

    canvas.style.width = ancho + "px";
    canvas.style.height = alto + "px";

    ctx.setTransform(
        pixelRatio,
        0,
        0,
        pixelRatio,
        0,
        0
    );
}

ajustarCanvas();

window.addEventListener("resize", ajustarCanvas);


/* =====================================================
   ESTRELLAS
===================================================== */

function crearEstrellas() {

    estrellas = [];

    const cantidad = Math.min(
        180,
        Math.floor((ancho * alto) / 6500)
    );

    for (let i = 0; i < cantidad; i++) {

        estrellas.push({
            x: Math.random() * ancho,
            y: Math.random() * alto,
            r: Math.random() * 1.5 + .2,
            brillo: Math.random(),
            velocidad: Math.random() * .02 + .005
        });
    }
}

crearEstrellas();


/* =====================================================
   PARTICULAS GALÁCTICAS
===================================================== */

function crearParticulas() {

    particulas = [];

    const cantidad = Math.min(
        500,
        Math.floor((ancho * alto) / 3500)
    );

    for (let i = 0; i < cantidad; i++) {

        const angulo = Math.random() * Math.PI * 2;
        const radio = Math.random() * Math.max(ancho, alto) * .42;

        particulas.push({
            angulo: angulo,
            radio: radio,
            velocidad: (Math.random() * .0008) + .0002,
            tamaño: Math.random() * 1.5 + .3,
            opacidad: Math.random() * .7 + .2
        });
    }
}

crearParticulas();


/* =====================================================
   DIBUJAR ESTRELLAS
===================================================== */

function dibujarEstrellas() {

    for (const estrella of estrellas) {

        estrella.brillo += estrella.velocidad;

        const opacidad =
            .35 +
            Math.sin(estrella.brillo) * .35;

        ctx.beginPath();

        ctx.arc(
            estrella.x,
            estrella.y,
            estrella.r,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "rgba(255,255,255," +
            Math.max(.1, opacidad) +
            ")";

        ctx.fill();
    }
}


/* =====================================================
   GALAXIA
===================================================== */

function dibujarGalaxia() {

    const cx = ancho / 2;
    const cy = alto / 2;

    for (const p of particulas) {

        p.angulo += p.velocidad;

        const x =
            cx +
            Math.cos(p.angulo) *
            p.radio;

        const y =
            cy +
            Math.sin(p.angulo) *
            p.radio *
            .55;

        const distancia =
            Math.sqrt(
                Math.pow(x - cx, 2) +
                Math.pow(y - cy, 2)
            );

        const opacidad =
            p.opacidad *
            Math.max(
                0,
                1 - distancia / (Math.max(ancho, alto) * .6)
            );

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            p.tamaño,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "rgba(255,210,80," +
            opacidad +
            ")";

        ctx.fill();
    }
}


/* =====================================================
   AGUJERO NEGRO CENTRAL
===================================================== */

function dibujarAgujeroNegro() {

    const cx = ancho / 2;
    const cy = alto / 2;

    const radio =
        Math.min(ancho, alto) * .13;

    const gradiente =
        ctx.createRadialGradient(
            cx,
            cy,
            radio * .15,
            cx,
            cy,
            radio * 2.8
        );

    gradiente.addColorStop(
        0,
        "rgba(0,0,0,1)"
    );

    gradiente.addColorStop(
        .35,
        "rgba(0,0,0,.98)"
    );

    gradiente.addColorStop(
        .65,
        "rgba(255,170,0,.15)"
    );

    gradiente.addColorStop(
        1,
        "rgba(255,170,0,0)"
    );

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radio * 2.8,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = gradiente;
    ctx.fill();


    /* Centro negro */

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radio,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#000";
    ctx.fill();


    /* Anillo */

    ctx.beginPath();

    ctx.ellipse(
        cx,
        cy,
        radio * 1.75,
        radio * .55,
        -.15,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle =
        "rgba(255,190,40,.55)";

    ctx.lineWidth = 3;

    ctx.shadowBlur = 20;
    ctx.shadowColor = "#ffb300";

    ctx.stroke();

    ctx.shadowBlur = 0;
}


/* =====================================================
   ANIMACIÓN PRINCIPAL
===================================================== */

function animar() {

    tiempo += .01;

    ctx.clearRect(
        0,
        0,
        ancho,
        alto
    );

    /* Fondo */

    const fondo =
        ctx.createRadialGradient(
            ancho / 2,
            alto / 2,
            0,
            ancho / 2,
            alto / 2,
            Math.max(ancho, alto) * .7
        );

    fondo.addColorStop(
        0,
        "#130d00"
    );

    fondo.addColorStop(
        .45,
        "#050400"
    );

    fondo.addColorStop(
        1,
        "#000000"
    );

    ctx.fillStyle = fondo;

    ctx.fillRect(
        0,
        0,
        ancho,
        alto
    );


    dibujarEstrellas();
    dibujarGalaxia();
    dibujarAgujeroNegro();

    requestAnimationFrame(animar);
}

animar();


/* =====================================================
   FLORES AMARILLAS
===================================================== */

function crearFlor() {

    if (!document.body.classList.contains("iniciado")) {
        return;
    }

    const flor = document.createElement("div");

    flor.className = "flor";

    flor.textContent = "🌻";

    flor.style.left =
        Math.random() * 100 + "vw";

    flor.style.fontSize =
        (16 + Math.random() * 22) + "px";

    flor.style.animationDuration =
        (5 + Math.random() * 6) + "s";

    flor.style.animationDelay =
        "0s";

    document.body.appendChild(flor);

    setTimeout(() => {

        flor.remove();

    }, 12000);
}


/* =====================================================
   CREAR FLORES CADA CIERTO TIEMPO
===================================================== */

setInterval(
    crearFlor,
    700
);


/* =====================================================
   INICIAR TODO
===================================================== */

function comenzar() {

    if (musicaIniciada) {
        return;
    }

    /*
       IMPORTANTE:
       Esta función se ejecuta directamente
       después del toque del usuario.
       Por eso el navegador permite reproducir audio.
    */

    musica.volume = 1.0;

    musica.currentTime = 0;

    const reproduccion = musica.play();

    if (reproduccion !== undefined) {

        reproduccion
            .then(() => {

                musicaIniciada = true;

                document.body.classList.add(
                    "iniciado"
                );

                inicio.classList.add(
                    "ocultar"
                );

                setTimeout(() => {

                    inicio.style.display = "none";

                }, 700);

                console.log(
                    "🎵 Música iniciada correctamente"
                );

            })
            .catch((error) => {

                console.error(
                    "Error al reproducir musica.mp3:",
                    error
                );

            });

    } else {

        musicaIniciada = true;

        document.body.classList.add(
            "iniciado"
        );

        inicio.classList.add(
            "ocultar"
        );
    }
}


/* =====================================================
   TOQUE PARA INICIAR
===================================================== */

/*
   pointerdown funciona tanto en celular
   como en computadora.
*/

inicio.addEventListener(
    "pointerdown",
    comenzar,
    {
        once: true
    }
);


/* =====================================================
   SEGURIDAD EXTRA PARA CELULARES
===================================================== */

inicio.addEventListener(
    "touchstart",
    function () {

        if (!musicaIniciada) {
            comenzar();
        }

    },
    {
        passive: true,
        once: true
    }
);


/* =====================================================
   DETECTAR ERROR DEL AUDIO
===================================================== */

musica.addEventListener(
    "error",
    function () {

        console.error(
            "No se pudo cargar ./musica.mp3"
        );

        console.error(
            musica.error
        );

    }
);

</script>

</body>
</html>
