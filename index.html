<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               user-scalable=no">

<title>Para mi Andrea 🌻</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

body {
    position: relative;
    font-family: Georgia, "Times New Roman", serif;
}

#canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
    touch-action: none;
}

#inicio {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;

    background:
        radial-gradient(
            circle,
            #171020 0%,
            #08050b 48%,
            #000 100%
        );

    transition: opacity 1.5s ease;
}

#inicio.ocultar {
    opacity: 0;
    pointer-events: none;
}

.flor-inicio {
    font-size: 75px;
    margin-bottom: 25px;

    animation:
        latido 1.8s ease-in-out infinite;

    filter:
        drop-shadow(
            0 0 15px
            rgba(255,210,0,.95)
        );
}

#inicio h1 {
    width: 90%;
    color: #ffd83d;
    font-size: 29px;
    line-height: 1.35;

    font-family:
        "Palatino Linotype",
        "Book Antiqua",
        Palatino,
        Georgia,
        serif;

    font-weight: normal;

    text-shadow:
        0 0 8px #fff4a3,
        0 0 18px #ffd000,
        0 0 35px #ff9d00;
}

#inicio p {
    margin-top: 28px;
    color: white;
    font-size: 18px;
    letter-spacing: 1px;

    text-shadow:
        0 0 8px white,
        0 0 18px rgba(255,215,100,.8);
}

#mensaje {
    position: fixed;
    left: 50%;
    top: 43%;
    width: 90%;
    max-width: 680px;
    z-index: 25;
    text-align: center;
    pointer-events: none;
    opacity: 0;

    transform:
        translate(-50%,-50%)
        scale(.88);

    transition:
        opacity .9s ease,
        transform .9s ease;
}

#mensaje.mostrar {
    opacity: 1;

    transform:
        translate(-50%,-50%)
        scale(1);
}

#mensaje h2 {
    color: #ffe45c;
    font-size: 37px;
    line-height: 1.3;

    font-family:
        "Palatino Linotype",
        "Book Antiqua",
        Palatino,
        Georgia,
        serif;

    font-weight: normal;
    letter-spacing: 1px;

    text-shadow:
        0 0 6px #fff4a3,
        0 0 15px #ffd000,
        0 0 28px #ffae00,
        0 0 45px #ff7900;

    animation:
        brilloTitulo 2.5s
        ease-in-out
        infinite alternate;
}

#mensaje p {
    margin-top: 20px;
    color: white;
    font-size: 25px;
    line-height: 1.7;

    font-family:
        "Palatino Linotype",
        "Book Antiqua",
        Palatino,
        Georgia,
        serif;

    letter-spacing: 1px;

    text-shadow:
        0 0 5px white,
        0 0 12px white,
        0 0 22px rgba(255,220,120,.95);

    animation:
        brilloTexto 2.5s
        ease-in-out
        infinite alternate;
}

.corazon {
    display: block;
    margin-top: 17px;
    font-size: 62px;

    animation:
        latido 1.1s infinite;

    filter:
        drop-shadow(0 0 15px red);
}

#fotos-orbita {
    position: fixed;
    inset: 0;
    z-index: 18;
    pointer-events: none;
}

.foto-orbita {
    position: absolute;
    left: 50%;
    top: 50%;

    width: 125px;
    height: 125px;

    object-fit: cover;
    border-radius: 50%;

    border:
        3px solid
        rgba(255,220,80,.95);

    box-shadow:
        0 0 8px white,
        0 0 18px #ffd000,
        0 0 35px rgba(255,160,20,.8);

    will-change: transform;
}

#flores-caidas {
    position: fixed;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    overflow: hidden;
}

.flor-cayendo {
    position: absolute;
    top: -80px;
    opacity: 0;

    filter:
        drop-shadow(
            0 0 7px
            rgba(255,215,0,.9)
        );

    animation:
        caerFlor
        linear
        forwards;

    will-change:
        transform,
        opacity;
}

@keyframes caerFlor {

    0% {
        transform:
            translate3d(0,-80px,0)
            rotate(0deg);

        opacity: 0;
    }

    10% {
        opacity: .95;
    }

    50% {
        transform:
            translate3d(35px,50vh,0)
            rotate(180deg);

        opacity: 1;
    }

    100% {
        transform:
            translate3d(-45px,115vh,0)
            rotate(360deg);

        opacity: 0;
    }
}

.flor-lateral {
    position: absolute;
    opacity: 0;

    filter:
        drop-shadow(
            0 0 8px
            rgba(255,215,0,.9)
        );

    animation:
        entrarLateral
        ease-in-out
        forwards;

    will-change:
        transform,
        opacity;
}

.flor-izquierda {
    left: -70px;
}

.flor-derecha {
    right: -70px;
}

@keyframes entrarLateral {

    0% {
        opacity: 0;

        transform:
            translateX(0)
            rotate(0deg)
            scale(.6);
    }

    20% {
        opacity: .9;
    }

    50% {
        opacity: 1;

        transform:
            translateX(var(--movimiento))
            rotate(180deg)
            scale(1);
    }

    80% {
        opacity: .85;
    }

    100% {
        opacity: 0;

        transform:
            translateX(
                calc(
                    var(--movimiento) * .7
                )
            )
            rotate(360deg)
            scale(.7);
    }
}

#ayuda {
    position: fixed;
    left: 50%;
    bottom: 32px;

    transform:
        translateX(-50%);

    z-index: 40;

    color:
        rgba(255,255,255,.78);

    font-size: 14px;
    text-align: center;
    pointer-events: none;

    text-shadow:
        0 0 8px white,
        0 0 15px rgba(255,210,80,.8);

    transition:
        opacity 1s ease;
}

#ayuda.ocultar {
    opacity: 0;
}

@keyframes latido {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.12);
    }

    100% {
        transform: scale(1);
    }
}

@keyframes brilloTitulo {

    from {
        transform: scale(1);

        text-shadow:
            0 0 5px #fff4a3,
            0 0 14px #ffd000,
            0 0 25px #ffae00;
    }

    to {
        transform: scale(1.015);

        text-shadow:
            0 0 10px white,
            0 0 20px #ffd000,
            0 0 38px #ffae00;
    }
}

@keyframes brilloTexto {

    from {
        text-shadow:
            0 0 4px white,
            0 0 10px white,
            0 0 18px rgba(255,220,120,.7);
    }

    to {
        text-shadow:
            0 0 8px white,
            0 0 18px white,
            0 0 32px rgba(255,220,120,1);
    }
}

@media (max-width:600px) {

    #inicio h1 {
        font-size: 25px;
    }

    #mensaje {
        top: 43%;
    }

    #mensaje h2 {
        font-size: 29px;

        text-shadow:
            0 0 4px rgba(255,244,163,.65),
            0 0 10px rgba(255,208,0,.45);
    }

    #mensaje p {
        font-size: 20px;

        text-shadow:
            0 0 4px rgba(255,255,255,.7);
    }

    .foto-orbita {
        width: 90px;
        height: 90px;

        box-shadow:
            0 0 5px white,
            0 0 10px #ffd000;
    }

    .corazon {
        font-size: 52px;
    }

    #ayuda {
        font-size: 13px;
        bottom: 22px;
    }

    .flor-cayendo,
    .flor-lateral {
        filter: none;
    }
}

@media (prefers-reduced-motion: reduce) {

    .flor-cayendo,
    .flor-lateral,
    .corazon,
    .flor-inicio,
    #mensaje h2,
    #mensaje p {

        animation-duration: 3s;
    }
}

</style>

</head>

<body>

<canvas id="canvas"></canvas>

<div id="inicio">

    <div class="flor-inicio">
        🌻
    </div>

    <h1>
        Feliz día de las flores amarillas 🌻
    </h1>

    <p>
        Toca para iniciar ✨
    </p>

</div>

<div id="fotos-orbita">

    <img
        src="foto1.jpeg"
        class="foto-orbita"
        id="foto1">

    <img
        src="foto2.jpeg"
        class="foto-orbita"
        id="foto2">

    <img
        src="foto3.jpeg"
        class="foto-orbita"
        id="foto3">

</div>

<div id="flores-caidas"></div>

<div id="mensaje">

    <h2>
        Feliz día de las flores amarillas,
        mi Andrea 🌻
    </h2>

    <p>
        Para ti, mi amor.
        <br>
        Te amo, mi chinita ❤️
    </p>

    <span class="corazon">
        ❤️
    </span>

</div>

<div id="ayuda">
    👆 Arrastra para girar la galaxia
</div>

<!-- ================================
     AUDIO
================================ -->

<audio
    id="musica"
    preload="auto"
    loop
    playsinline>

    <source
    src="https://yesscor246-hue.github.io/flores-amarillas-andreabb/musica.mp3"
    type="audio/mpeg">

</audio>

<script>

const esMovil =
    window.matchMedia(
        "(max-width: 600px)"
    ).matches;


/* =========================================
   CANVAS
========================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext(
        "2d",
        { alpha: false }
    );

let width;
let height;

let centerX;
let centerY;

let dpr =
    Math.min(
        window.devicePixelRatio || 1,
        esMovil ? 1 : 1.25
    );

function resize() {

    width = window.innerWidth;
    height = window.innerHeight;

    centerX = width / 2;
    centerY = height / 2;

    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            esMovil ? 1 : 1.25
        );

    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================
   PARTÍCULAS
========================================= */

const particles = [];

const particleCount =
    esMovil ? 260 : 650;

for (
    let i = 0;
    i < particleCount;
    i++
) {

    particles.push({

        angle:
            Math.random()
            * Math.PI
            * 2,

        radius:
            45 +
            Math.pow(
                Math.random(),
                .55
            ) * 330,

        size:
            Math.random()
            * 2
            + .45,

        speed:
            .00025 +
            Math.random()
            * .0006,

        arm:
            Math.random()
            * 4,

        brightness:
            .35 +
            Math.random()
            * .65

    });
}


/* =========================================
   ROTACIÓN
========================================= */

let rotation = 0;
let velocity = 0;
let dragging = false;
let lastX = 0;
let lastY = 0;
let lastTime = 0;

canvas.addEventListener(
    "pointerdown",
    e => {

        dragging = true;

        lastX = e.clientX;
        lastY = e.clientY;

        lastTime =
            performance.now();

        canvas.setPointerCapture(
            e.pointerId
        );
    }
);

canvas.addEventListener(
    "pointermove",
    e => {

        if (!dragging)
            return;

        const now =
            performance.now();

        const dx =
            e.clientX - lastX;

        const dy =
            e.clientY - lastY;

        rotation +=
            dx * .008;

        rotation +=
            dy * .002;

        const elapsed =
            Math.max(
                1,
                now - lastTime
            );

        velocity =
            dx /
            elapsed *
            .025;

        lastX = e.clientX;
        lastY = e.clientY;
        lastTime = now;
    }
);

canvas.addEventListener(
    "pointerup",
    () => {
        dragging = false;
    }
);

canvas.addEventListener(
    "pointercancel",
    () => {
        dragging = false;
    }
);


/* =========================================
   AGUJERO NEGRO
========================================= */

function drawBlackHole() {

    const halo =
        ctx.createRadialGradient(
            centerX,
            centerY,
            35,
            centerX,
            centerY,
            160
        );

    halo.addColorStop(
        0,
        "rgba(0,0,0,1)"
    );

    halo.addColorStop(
        .35,
        "rgba(255,190,30,.15)"
    );

    halo.addColorStop(
        .60,
        "rgba(255,140,10,.08)"
    );

    halo.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle = halo;

    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        160,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.strokeStyle =
        "rgba(255,215,80,.85)";

    ctx.lineWidth = 4;

    ctx.shadowBlur =
        esMovil ? 8 : 18;

    ctx.shadowColor =
        "#ffc928";

    ctx.beginPath();

    ctx.ellipse(
        centerX,
        centerY,
        105,
        32,
        0,
        0,
        Math.PI * 2
    );

    ctx.stroke();

    ctx.shadowBlur = 0;

    ctx.fillStyle = "#000";

    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        78,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


/* =========================================
   GALAXIA
========================================= */

function drawGalaxy(time) {

    ctx.fillStyle = "#000";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    if (!dragging) {

        rotation +=
            .00025 +
            velocity;

        velocity *= .96;
    }

    const maxRadius =
        Math.min(
            width,
            height
        ) * .43;

    for (
        let i = 0;
        i < particles.length;
        i++
    ) {

        const p =
            particles[i];

        const localAngle =
            p.angle +
            rotation +
            time * p.speed;

        const armWave =
            Math.sin(
                p.arm +
                p.radius * .018
            ) * .55;

        const angle =
            localAngle +
            armWave;

        const r =
            p.radius *
            (
                maxRadius / 330
            );

        const depth =
            .52 +
            Math.sin(angle) * .48;

        const x =
            centerX +
            Math.cos(angle) * r;

        const y =
            centerY +
            Math.sin(angle) *
            r * .28 +
            (1 - depth) * 35;

        const centerBoost =
            1 -
            Math.min(
                r / maxRadius,
                1
            );

        const alpha =
            .18 +
            p.brightness * .70 +
            centerBoost * .20;

        ctx.fillStyle =
            `rgba(
                255,
                ${185 + Math.floor(
                    centerBoost * 55
                )},
                40,
                ${alpha}
            )`;

        const size =
            p.size *
            (
                .7 +
                depth * .9
            );

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.strokeStyle =
        "rgba(255,210,55,.22)";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.ellipse(
        centerX,
        centerY,
        maxRadius * .92,
        maxRadius * .25,
        0,
        0,
        Math.PI * 2
    );

    ctx.stroke();

    ctx.strokeStyle =
        "rgba(255,150,30,.15)";

    ctx.beginPath();

    ctx.ellipse(
        centerX,
        centerY,
        maxRadius * .72,
        maxRadius * .19,
        0,
        0,
        Math.PI * 2
    );

    ctx.stroke();

    drawBlackHole();
}


/* =========================================
   ESTRELLAS
========================================= */

const stars = [];

const starCount =
    esMovil ? 55 : 140;

for (
    let i = 0;
    i < starCount;
    i++
) {

    stars.push({

        x:
            Math.random() * width,

        y:
            Math.random() * height,

        size:
            Math.random()
            * 1.5
            + .3,

        phase:
            Math.random()
            * Math.PI
            * 2
    });
}

function drawStars(time) {

    for (
        let i = 0;
        i < stars.length;
        i++
    ) {

        const s =
            stars[i];

        const twinkle =
            .35 +
            (
                Math.sin(
                    time * .002 +
                    s.phase
                ) + 1
            ) * .25;

        ctx.fillStyle =
            `rgba(
                255,
                255,
                220,
                ${twinkle}
            )`;

        ctx.beginPath();

        ctx.arc(
            s.x,
            s.y,
            s.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


/* =========================================
   FOTOS
========================================= */

const fotos = [

    document.getElementById(
        "foto1"
    ),

    document.getElementById(
        "foto2"
    ),

    document.getElementById(
        "foto3"
    )

];

function actualizarFotos(time) {

    const radioBase =
        Math.min(
            width,
            height
        ) * .34;

    fotos.forEach(
        (foto, index) => {

            const angulo =
                rotation * .45 +
                time * .00012 +
                index *
                (
                    Math.PI * 2 / 3
                );

            const profundidad =
                (
                    Math.sin(angulo)
                    + 1
                ) / 2;

            const radio =
                radioBase *
                (
                    .82 +
                    profundidad * .18
                );

            const x =
                Math.cos(angulo)
                * radio;

            const y =
                Math.sin(angulo)
                * radio
                * .48;

            const escala =
                .72 +
                profundidad * .48;

            const opacidad =
                .55 +
                profundidad * .45;

            const tamaño =
                (
                    esMovil
                        ? 90
                        : 125
                ) * escala;

            foto.style.width =
                tamaño + "px";

            foto.style.height =
                tamaño + "px";

            foto.style.opacity =
                opacidad;

            foto.style.zIndex =
                10 +
                Math.floor(
                    profundidad * 15
                );

            foto.style.transform =
                `translate(
                    ${x - tamaño / 2}px,
                    ${y - tamaño / 2}px
                )
                rotate(
                    ${angulo * 25}deg
                )`;
        }
    );
}


/* =========================================
   ANIMACIÓN
========================================= */

let ultimoFrame = 0;

const intervaloMovil =
    1000 / 45;

function animate(time) {

    if (
        esMovil &&
        time - ultimoFrame <
        intervaloMovil
    ) {

        requestAnimationFrame(
            animate
        );

        return;
    }

    ultimoFrame = time;

    drawGalaxy(time);
    drawStars(time);
    actualizarFotos(time);

    requestAnimationFrame(
        animate
    );
}

requestAnimationFrame(
    animate
);


/* =========================================
   ELEMENTOS
========================================= */

const inicio =
    document.getElementById(
        "inicio"
    );

const mensaje =
    document.getElementById(
        "mensaje"
    );

const ayuda =
    document.getElementById(
        "ayuda"
    );

const musica =
    document.getElementById(
        "musica"
    );

const floresCaidas =
    document.getElementById(
        "flores-caidas"
    );

let iniciada = false;


/* =========================================
   FLOR QUE CAE
========================================= */

function crearFlorCaida() {

    if (!iniciada)
        return;

    const flor =
        document.createElement(
            "div"
        );

    flor.className =
        "flor-cayendo";

    flor.textContent = "🌻";

    flor.style.left =
        Math.random() * 100 + "%";

    const tamaño =
        17 +
        Math.random() * 23;

    flor.style.fontSize =
        tamaño + "px";

    const duracion =
        5 +
        Math.random() * 5;

    flor.style.animationDuration =
        duracion + "s";

    floresCaidas.appendChild(
        flor
    );

    setTimeout(
        () => {
            flor.remove();
        },
        (duracion + 2) * 1000
    );
}


/* =========================================
   FLOR LATERAL
========================================= */

function crearFlorLateral() {

    if (!iniciada)
        return;

    const flor =
        document.createElement(
            "div"
        );

    flor.className =
        "flor-lateral";

    const izquierda =
        Math.random() > .5;

    flor.classList.add(
        izquierda
            ? "flor-izquierda"
            : "flor-derecha"
    );

    flor.textContent = "🌻";

    flor.style.top =
        (
            15 +
            Math.random() * 70
        ) + "vh";

    const movimiento =
        90 +
        Math.random() * 120;

    flor.style.setProperty(
        "--movimiento",
        (
            izquierda
                ? movimiento
                : -movimiento
        ) + "px"
    );

    flor.style.fontSize =
        (
            18 +
            Math.random() * 20
        ) + "px";

    const duracion =
        5 +
        Math.random() * 4;

    flor.style.animationDuration =
        duracion + "s";

    floresCaidas.appendChild(
        flor
    );

    setTimeout(
        () => {
            flor.remove();
        },
        (duracion + 1) * 1000
    );
}


/* =========================================
   INICIO + AUDIO
========================================= */

function comenzar() {

    if (iniciada)
        return;

    iniciada = true;

    /*
       IMPORTANTE:
       play() se ejecuta directamente
       después del toque del usuario.
    */

    musica.volume = 1.0;
musica.muted = false;

const reproduccion =
    musica.play();

    if (reproduccion !== undefined) {

        reproduccion
            .then(() => {

                console.log(
                    "🎵 Música iniciada"
                );

            })
            .catch(error => {

                console.error(
                    "Error al reproducir:",
                    error
                );

            });
    }

    inicio.classList.add(
        "ocultar"
    );

    setTimeout(
        () => {

            mensaje.classList.add(
                "mostrar"
            );

        },
        2200
    );

    setInterval(
        crearFlorCaida,
        esMovil ? 950 : 650
    );

    setInterval(
        crearFlorLateral,
        esMovil ? 2600 : 1400
    );

    setTimeout(
        () => {

            ayuda.classList.add(
                "ocultar"
            );

        },
        9000
    );
}


/* =========================================
   EVENTOS
========================================= */

inicio.addEventListener(
    "pointerdown",
    comenzar,
    { once: true }
);

document.addEventListener(
    "keydown",
    e => {

        if (
            e.code === "Space" ||
            e.code === "Enter"
        ) {

            comenzar();

        }

    }
);

</script>
